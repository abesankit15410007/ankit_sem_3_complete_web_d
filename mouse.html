<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>

    <style>
        #main {
            display: flex;
            gap: 20px;
            margin-top: 200px;
            margin-left: 100px;
        }

        #box {
            height: 300px;
            width: 300px;
            background-color: aqua;
            border: 5px solid rgb(152, 172, 251);
        }

        #box2 {
            height: 300px;
            width: 300px;
            background-color: aqua;
            border: 5px solid rgb(152, 177, 251);
        }

        #box3 {
            height: 300px;
            width: 300px;
            background-color: aqua;
            border: 5px solid rgb(29, 160, 183);
        }
        #box4 {
            height: 300px;
            width: 300px;
            background-color: aqua;
            border: 5px solid rgb(29, 160, 183);
        }
    </style>

    <script>
        function eventcall() {
            alert("These are the mouse events");
        }
    </script>
</head>

<body>
    <div id="main">
        <div id="box" ondblclick="eventcall()">Double Click Event</div>
        <div id="box2" onclick="eventcall()">This is Onclick Event</div>
        <div id="box3" onmouseover="eventcall()">This is Mouseover Event</div>
        <div id="box4" onmouseout="eventcall()">This is Mouseout Event</div>
    </div>

</body>
</html>
