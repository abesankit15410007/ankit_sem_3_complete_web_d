<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Information Form</title>
</head>
<body>
  <div id ="form" >
    <h1 id ="h1">keyboard event </h1>
    <P>onkeydown</P>
    <input type="text" onkeydown="alert(this.value)" placeholder="Enter text here">
    <P>onkeypress</P>
    <input type="text" onkeypress="alert(this.value)" placeholder="Enter text here">
    <P>onkeyup</P>
    <input type="text" onkeyup="alert(this.value)" placeholder="Enter text here"> 
  </div>
    </form>

</body>
</html>
